services:
  postgres:
    image: postgres:16
    container_name: impact_aware_pg
    environment:
      POSTGRES_USER: qop_user
      POSTGRES_PASSWORD: qop_pass
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "max_connections=100"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qop_user -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:7
    container_name: impact_aware_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    environment:
      MONGO_INITDB_DATABASE: qop_feedback

volumes:
  pgdata:
  mongodata: